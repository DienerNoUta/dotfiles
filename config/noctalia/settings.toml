config_version = 14

[bar.default]
margin_ends = 0
radius = 0

[control_center]
show_session_button = false

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
enabled = true
position = "left"
reserve_space = false
show_dots = true

[location]
address = "Panama"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."andrewdems/vpn-manager"]
auto_connect_enabled = true
auto_disconnect_on_trusted = false
panel_open_near_click = false
panel_placement = "floating"

[plugins]
enabled = [ "andrewdems/vpn-manager" ]

[shell]
telemetry_enabled = true

    [shell.launcher]
    compact = true
    show_app_origin_indicator = false

[theme]
builtin = "Ayu"
community_palette = "Tomorrow"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/o/Images/bg"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/o/Images/bg/6llpv6.jpg"

    [wallpaper.last]
    path = "/home/o/Images/bg/6llpv6.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/o/Images/bg/6llpv6.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/o/Images/bg/9oxg98.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
enabled = false

[widget.network]
enabled = false

[widget.notifications]
enabled = false

[widget.session]
enabled = false

[widget.volume]
enabled = false

[widget.wallpaper]
enabled = false